name: Publicar proximo video

on:
  schedule:
    - cron: "17 13 * * *"   # ~10h Brasilia
    - cron: "43 21 * * *"   # ~18h40 Brasilia
  workflow_dispatch:
    inputs:
      id:
        description: "ID do roteiro (opcional; vazio = o proximo da fila)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: planob-publicar
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Profundidade por IA (opcional; cai na heuristica se falhar)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true
          pip install transformers || true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-depth-anything-v2-small

      - name: Escrever roteiro novo se a fila estiver curta
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python roteirista.py --se-fila-curta || true

      - name: Renderizar e publicar
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          ARGS=""
          if [ -n "${{ github.event.inputs.id }}" ]; then ARGS="--id ${{ github.event.inputs.id }}"; fi
          set +e
          python publish.py $ARGS
          COD=$?
          rm -f token.json
          git config user.name "planob-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/*.json conteudo/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: estado da publicacao"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase --autostash origin main
            sleep 5
          done
          exit $COD

      - name: Previa (quadros do video) como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore
